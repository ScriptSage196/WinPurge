# WinPurge - Configuration File

# Settings for WinPurge core behavior
[Core]
Version = "2.0"
Author = "ScriptSage196"
Repository = "https://github.com/ScriptSage196/WinPurge"
License = "MIT"

# Logging configuration
[Logging]
LogLevel = "INFO"          # DEBUG, INFO, WARNING, ERROR, SUCCESS
LogToFile = "true"
LogPath = "$env:TEMP\WinPurge_audit.json"
MaxLogSize = "10MB"
ArchiveOldLogs = "true"

# System Protection
[Protection]
CreateRestorePoint = "true"
RequireConfirmation = "true"
ElevationRequired = "true"
BackupBefore = "true"

# Default Behavior
[Defaults]
DefaultPreset = "Standard"
DryRunByDefault = "true"
VerboseLogging = "false"
AutoUpdate = "false"
CheckForUpdates = "true"

# AI Protection (Post-Update Prevention)
[AIProtection]
BlockCopilot = "true"
BlockSearchAI = "true"
BlockSettingsAI = "true"
CreatePostUpdateTask = "true"
BlockReinstall = "true"

# Service Optimization
[Services]
DisableTelemetry = "true"
DisableTracking = "true"
DisableSearchIndexing = "false"
DisableUpdateDelay = "false"

# Network Security
[Network]
EnableDNSOverHTTPS = "false"
DNSProvider = "Cloudflare"    # Cloudflare, Google, Quad9
DisableIPv6 = "false"
DisableModernStandby = "false"

# Performance
[Performance]
OptimizeVisualEffects = "true"
BenchmarkBefore = "true"
BenchmarkAfter = "true"
ReportPerformanceGains = "true"

# Plugin System
[Plugins]
PluginPath = "plugins"
AutoLoadPlugins = "true"
AllowUnsignedPlugins = "false"
SandboxPlugins = "false"

# UI/Display
[UI]
Theme = "Dark"
Language = "en-US"            # en-US, hi-IN, etc.
ShowWelcomeScreen = "true"
CompactMode = "false"
